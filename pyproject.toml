[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vistafuzz"
version = "1.0.0"
description = "LLM-guided documentation-based fuzzing for arbitrary Python libraries"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
vistafuzz = "vistafuzz.cli:main"

[tool.setuptools]
packages = ["vistafuzz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
